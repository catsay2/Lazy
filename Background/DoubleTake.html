<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Take - Dynamic Aesthetic Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0714; /* Nền tím đêm sâu thẳm */
        }

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* --- CÁC KHỐI MÀU CHUYỂN ĐỘNG (MESH BLOBS) --- */
        .blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.8;
            mix-blend-mode: screen;
            animation: floatBlob var(--speed) infinite alternate ease-in-out;
        }

        /* Đỏ hồng lãng mạn */
        .blob-1 {
            width: 85vw;
            height: 85vw;
            background: radial-gradient(circle, rgba(233, 64, 87, 0.85) 0%, rgba(233, 64, 87, 0) 70%);
            top: -20%;
            left: -20%;
            --speed: 10s;
        }

        /* Tím đêm deep vibe */
        .blob-2 {
            width: 95vw;
            height: 95vw;
            background: radial-gradient(circle, rgba(138, 35, 135, 0.9) 0%, rgba(138, 35, 135, 0) 70%);
            bottom: -25%;
            right: -25%;
            --speed: 14s;
        }

        /* Cam hoàng hôn ấm */
        .blob-3 {
            width: 75vw;
            height: 75vw;
            background: radial-gradient(circle, rgba(242, 113, 33, 0.75) 0%, rgba(242, 113, 33, 0) 70%);
            top: 25%;
            left: 15%;
            --speed: 12s;
        }

        /* Hồng phấn dải ánh sáng bổ trợ */
        .blob-4 {
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(255, 107, 107, 0.65) 0%, rgba(255, 107, 107, 0) 70%);
            bottom: 10%;
            left: -15%;
            --speed: 16s;
        }

        @keyframes floatBlob {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            50% {
                transform: translate(12%, 15%) scale(1.15) rotate(180deg);
            }
            100% {
                transform: translate(-10%, 8%) scale(0.95) rotate(360deg);
            }
        }

        /* --- LỚP HÀO QUANG THỞ NỀN --- */
        .glow-overlay {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.06) 0%, transparent 60%);
            animation: pulseGlow 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.85); opacity: 0.3; }
            100% { transform: scale(1.15); opacity: 0.8; }
        }

        /* --- CÁC HẠT BOKEH PHÁT SÁNG LƠ LỬNG --- */
        .bokeh {
            position: absolute;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 215, 230, 0.9), 0 0 20px rgba(233, 64, 87, 0.6);
            animation: floatBokeh var(--duration) linear infinite;
            opacity: 0;
        }

        @keyframes floatBokeh {
            0% {
                transform: translateY(105vh) scale(0.4);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <!-- Lớp hào quang -->
        <div class="glow-overlay"></div>
        
        <!-- Các khối màu Mesh uốn lượn -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>

        <!-- Chứa các hạt Bokeh lơ lửng -->
        <div id="bokeh-container"></div>
    </div>

    <script>
        // Tự động tạo hạt Bokeh lơ lửng ngẫu nhiên
        const container = document.getElementById('bokeh-container');
        const particleCount = 28;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'bokeh';
            
            const size = Math.random() * 5 + 2; // Kích thước hạt từ 2px đến 7px
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            
            // Thời gian bay từ 7s đến 15s
            particle.style.setProperty('--duration', `${Math.random() * 8 + 7}s`);
            particle.style.animationDelay = `${Math.random() * 10}s`;
            
            container.appendChild(particle);
        }
    </script>
</body>
</html>
